<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlexSant - Dev Back-end</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="APIs com Java/Spring e NestJS, front-end em React. Veja meus projetos."
    />

    <!-- Prévia do link no LinkedIn, WhatsApp, Discord etc. (Open Graph).
         Ficam fixas aqui porque os robôs desses apps não rodam o React.
         Endereços completos, com https://, porque o robô não sabe de qual site é o caminho. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://portifolio-web-alexsantos.vercel.app" />
    <meta property="og:title" content="Alexandre Santos | Desenvolvedor Full Stack" />
    <meta
      property="og:description"
      content="APIs com Java/Spring e NestJS, front-end em React. Veja meus projetos."
    />
    <meta
      property="og:image"
      content="https://portifolio-web-alexsantos.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Alexandre Santos, Desenvolvedor Full Stack com foco em Back-end"
    />
    <!-- Pede o card com imagem grande no X e no Discord -->
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Ícones: Font Awesome (classes fa-*) e Devicon (classes devicon-*) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.16.0/devicon.min.css"
    />
  </head>
  <body>
    <!-- O React monta o site inteiro aqui, a partir de src/main.jsx -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
